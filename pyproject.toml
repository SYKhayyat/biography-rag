[project]
name = "biography-rag"
version = "0.1.0"
description = "Upload pages about one person; retrieve, cite, and weave a story only from the sources."
readme = "README.md"
authors = [
    { name = "SYKhayyat" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.6",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "openai>=3.50.0",
    "pgvector>=0.5.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
local = [
    "fastembed>=0.9.1",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs TEST_DATABASE_URL (pgvector)"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # ruff format owns line length; typographic quotes in biography text are intended
