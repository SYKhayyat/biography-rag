# Render blueprint. `sync: false` makes Render ask for the value in the dashboard,
# so keys and the database URL never pass through git.
#
# Deploy: `render blueprint launch` (or New > Blueprint in the dashboard).

services:
  - type: web
    name: biography-rag
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health

    # Custom domain: bio.siachshai.online (add manually in Render dashboard → Settings → Custom Domains)
    # Cloudflare DNS: CNAME bio → biography-rag.onrender.com (proxied)

    envVars:
      # Postgres with pgvector. Without it the app falls back to in-memory storage,
      # which the free plan's sleep/restart wipes.
      - key: DATABASE_URL
        sync: false
      - key: EMBEDDER
        value: openai
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      # Optional: a provider shows up in the UI only once its key is set.
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: CHEAPLLM_API_KEY
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      # One shared HTTP Basic password for the whole site (empty = open).
      - key: SITE_PASSWORD
        sync: false
      # Required to delete corpora through the API.
      - key: ADMIN_TOKEN
        generateValue: true
      # Abuse brake: story runs and asks per client per hour.
      - key: RUNS_PER_HOUR_PER_CLIENT
        value: "20"
      - key: QUERY_CONCURRENCY
        value: "4"
      # The model that audits each story sentence. Empty = the model that wrote it.
      - key: JUDGE_PROVIDER
        sync: false
      - key: JUDGE_MODEL
        sync: false
      # Postgres connections (job workers x query threads share them).
      - key: DB_POOL_SIZE
        value: "12"
